name: ✨ Feature request
description: Suggest a new capability or improvement for MizpahPulse
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature! Please search
        [existing issues](https://github.com/MizPahPulse/MizPahPulse/issues?q=is%3Aissue)
        first to avoid duplicates.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What is the gap this feature fills? Who is it for?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web dashboard (Next.js)
        - WebSocket server
        - Ingester / event pipeline
        - Database / API
        - Soroban smart contract
        - Tooling / CI / docs
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative designs you considered.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Would you be willing to implement this?
      options:
        - label: I can submit a pull request for this feature
