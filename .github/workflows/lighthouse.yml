name: Lighthouse CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: lighthouse-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  # The web app connects to Postgres at runtime; mirror the Test job's setup.
  DATABASE_URL: 'postgresql://test:test@localhost:5432/test'

jobs:
  lighthouse:
    name: Lighthouse performance budgets
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=packages/database/prisma/schema.prisma

      - name: Run database migrations
        run: npx prisma migrate deploy --schema=packages/database/prisma/schema.prisma

      - name: Build web app
        run: npm run build --workspace=@mizpah-pulse/web

      # Collects Lighthouse results, asserts the budgets in
      # .github/lighthouse/lighthouserc.json (+ budget.json), uploads reports
      # to temporary public storage, and posts a comment with the scores on
      # PRs. Assertions that fail (accessibility, best-practices, SEO,
      # bundle-size) fail the job and block the merge.
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          runs: 2
          configPath: .github/lighthouse/lighthouserc.json
          temporaryPublicStorage: true
          commentOnPR: true