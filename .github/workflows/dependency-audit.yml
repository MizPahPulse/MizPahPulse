name: Dependency Audit

on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "**/package.json"
      - "contracts/Cargo.toml"
      - "contracts/Cargo.lock"
      - "contracts/**/Cargo.toml"
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1" # Every Monday at 05:00 UTC

concurrency:
  group: dep-audit-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Hard gate: fail on any critical vulnerability in the full tree
      # (runtime + dev). Known non-critical advisories are tracked as
      # upgrade blockers: toml via @stellar/stellar-sdk (needs SDK 17),
      # postcss via next (needs Next 16), vite chain via vitest (needs
      # vitest 5). `npm audit fix` was run to clear the previously present
      # criticals (Next.js RCEs).
      - name: npm audit (critical gate)
        run: npm audit --audit-level=critical

      - name: Print advisory summary
        run: npm audit || true

  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit