# ─────────────────────────────────────────────────────────────────────────
# MizPahPulse — "minimal" development profile (issue #75)
#
# Runs the app WITHOUT Redis (and without the ws/ingester services that need
# it). Use it when you only need the Next.js app + database to work on the
# UI/API:
#
#   docker compose -f docker-compose.minimal.yml up -d
#   # or, equivalently, with the explicit profile:
#   docker compose -f docker-compose.minimal.yml --profile minimal up -d
#
# The `web` service is started without REDIS_URL / WS_URL so the app runs in
# its degraded fallback mode: rate limiting uses the in-memory store and the
# real-time feed simply shows the reconnect banner (no WebSocket stream).
#
# The base docker-compose.yml (plain `docker compose up -d`) is unchanged and
# still starts the complete stack. Don't run both files at the same time —
# they use the same ports and container names.
# ─────────────────────────────────────────────────────────────────────────
services:
  # ──────────────────────────────────────
  # PostgreSQL Database
  # ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mizpah-pulse-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mizpah_pulse
      POSTGRES_USER: mizpah
      POSTGRES_PASSWORD: mizpah_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mizpah -d mizpah_pulse']
      interval: 5s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────
  # Next.js Web App (with API) — no Redis
  # ──────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
    container_name: mizpah-pulse-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      # No REDIS_URL / WS_URL: the app degrades gracefully (in-memory rate
      # limiting, no WebSocket feed).
      - DATABASE_URL=postgresql://mizpah:mizpah_dev@postgres:5432/mizpah_pulse
      - STELLAR_NETWORK=TESTNET
      - NODE_ENV=production
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
